# ==============================================================================
# ScamShield AI — Hardened Production Nginx Configuration
# ==============================================================================
# Place in /etc/nginx/sites-available/scamshield.conf and symlink to sites-enabled.

# Upstream Uvicorn worker pool
upstream scamshield_backend {
    # Unix domain socket (recommended for performance on single server):
    # server unix:/run/scamshield/scamshield.sock fail_timeout=0;

    # Or TCP loopback pool:
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Edge rate limiting zone (10 requests/sec with burst buffer)
limit_req_zone $binary_remote_addr zone=scamshield_api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=scamshield_conn_limit:10m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name scamshield.yourdomain.com;

    # ACME Challenge path for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scamshield.yourdomain.com;

    # TLS Certificates (manage via certbot)
    ssl_certificate /etc/letsencrypt/live/scamshield.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scamshield.yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/scamshield.yourdomain.com/chain.pem;

    # Modern TLS Ciphers & Protocol selection (TLS 1.2 & 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Strict Payload Limits (mitigate memory exhaustion)
    client_max_body_size 1M;
    client_body_buffer_size 128k;

    # Defense-in-depth Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # Static asset caching
    location /static/ {
        alias /opt/scamshield/app/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API endpoints & dynamic proxying
    location / {
        limit_req zone=scamshield_api_limit burst=20 nodelay;
        limit_conn scamshield_conn_limit 10;

        proxy_pass http://scamshield_backend;
        proxy_http_version 1.1;

        # WebSocket & HTTP/1.1 upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Health check bypass from rate limiting (for internal load balancer monitoring)
    location /api/v1/health {
        proxy_pass http://scamshield_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}
